plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rotatsulabs.axolotl.core.playback'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    compileOnly files("${rootDir}/libs/lib-decoder-ffmpeg-release.aar")

    api project(':core:data')

    def media3_version = "1.4.0"
    api "androidx.media3:media3-session:$media3_version"
    api "androidx.media3:media3-exoplayer:$media3_version"

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation('com.blankj:utilcodex:1.31.1') {
        exclude group: 'androidx.appcompat'
    }

    implementation 'com.github.xiaowine:Lyric-Getter-Api:6.0.0'

    implementation "com.github.Kyant0:taglib:1.0.0-alpha22"
}
