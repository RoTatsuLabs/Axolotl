plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.rotatsulabs.axolotl.core.data'
    compileSdk 34

    defaultConfig {
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    compileOnly files("${rootDir}/libs/libPhonograph-release.aar")

    api "androidx.compose.foundation:foundation:1.7.0-beta07"
    api 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    api "androidx.media3:media3-common:1.4.0"
    api "com.github.FunnySaltyFish.ComposeDataSaver:data-saver:1.1.9"

    implementation 'com.tencent:mmkv-static:1.3.5'
    implementation 'com.google.code.gson:gson:2.10.1'
}
